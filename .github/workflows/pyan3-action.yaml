name: Module Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-modules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyan3 graphviz networkx matplotlib
    - name: Generate module graph with pyan
      run: |
        mkdir -p reports
        # Run pyan as a Python module to avoid PATH issues
        find src -name "*.py" -type f > python_files.txt
        python -m pyan.scripts.pyan $(cat python_files.txt) --uses --no-defines --colored --grouped --dot > reports/module_dependencies.dot || python -m pyan $(cat python_files.txt) --uses --no-defines --colored --grouped --dot > reports/module_dependencies.dot || pyan3 $(cat python_files.txt) --uses --no-defines --colored --grouped --dot > reports/module_dependencies.dot

        # Convert DOT to PNG
        dot -Tpng reports/module_dependencies.dot -o reports/module_dependencies.png
    - name: Upload module graph
      uses: actions/upload-artifact@v4
      with:
        name: module-graph
        path: reports/module_dependencies.png

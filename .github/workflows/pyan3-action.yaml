name: Module Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-modules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyan3 graphviz
    - name: Generate module graph
      run: |
        mkdir -p reports
        pyan3 $(find . -name "*.py") --uses --no-defines --colored --grouped --annotated --dot > reports/module_dependencies.dot
        dot -Tpng reports/module_dependencies.dot -o reports/module_dependencies.png
    - name: Upload module graph
      uses: actions/upload-artifact@v3
      with:
        name: module-graph
        path: reports/module_dependencies.png

name: Module Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-modules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydeps graphviz networkx matplotlib
    - name: Generate module graph with pydeps
      run: |
        mkdir -p reports
        pydeps src --max-bacon=10 --cluster --noshow --output-format png --output-file reports/module_dependencies.png
    - name: Upload module graph
      uses: actions/upload-artifact@v4
      with:
        name: module-graph
        path: reports/module_dependencies.png

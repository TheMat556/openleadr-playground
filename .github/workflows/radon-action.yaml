name: Code Metrics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-metrics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install radon

    - name: Run code metrics analysis
      id: analysis
      run: |
        # Create output directory
        mkdir -p metrics_output

        # Run radon maintainability index
        radon mi . --json > metrics_output/mi.json

        # Run radon cyclomatic complexity
        radon cc . --json > metrics_output/cc.json

        # Get summary stats
        radon cc . --average > metrics_output/cc_avg.txt
        radon cc . --total > metrics_output/cc_total.txt

        # Process metrics and create the report
        python - <<EOF > metrics_output/report.md
        import json
        import os
        from datetime import datetime

        # Helper function to format ranks with emojis
        def format_mi_rank(rank):
            rank_emoji = {
                "A": "🟢",
                "B": "🟢",
                "C": "🟠",
                "D": "🔴",
                "F": "🔴"
            }
            emoji = rank_emoji.get(rank, "⚪")
            return f"{emoji} {rank}"

        # Helper function to format risk levels
        def get_risk_level(cc):
            if cc <= 5:
                return "🟢 Low"
            elif cc <= 10:
                return "🟡 Moderate"
            elif cc <= 20:
                return "🟠 High"
            else:
                return "🔴 Very High"

        # Process maintainability index data
        mi_table = "| Module | MI Score | Rank |\n|--------|----------|------|\n"
        try:
            with open("metrics_output/mi.json", "r") as f:
                mi_data = json.load(f)

            sorted_modules = sorted(
                [(module, data) for module, data in mi_data.items() if module.endswith((".py", ".js", ".ts", ".java", ".c", ".cpp"))],
                key=lambda x: x[1]["mi"],
                reverse=True
            )[:10]  # Top 10 modules

            for module, data in sorted_modules:
                mi_score = data["mi"]
                rank = data.get("rank", "N/A")
                mi_table += f"| {module} | {mi_score:.1f} | {format_mi_rank(rank)} |\n"
        except Exception as e:
            mi_table += f"| Error processing maintainability data | {str(e)} | - |\n"

        # Process cyclomatic complexity data
        cc_table = "| Module | Average CC | Highest CC | Risk |\n|--------|------------|------------|------|\n"
        try:
            with open("metrics_output/cc.json", "r") as f:
                cc_data = json.load(f)

            module_metrics = {}
            for module, functions in cc_data.items():
                if not functions or not module.endswith((".py", ".js", ".ts", ".java", ".c", ".cpp")):
                    continue

                cc_values = [func["complexity"] for func in functions]
                if cc_values:
                    avg_cc = sum(cc_values) / len(cc_values)
                    max_cc = max(cc_values)
                    module_metrics[module] = {
                        "avg_cc": avg_cc,
                        "max_cc": max_cc,
                        "risk": get_risk_level(max_cc)
                    }

            sorted_modules = sorted(module_metrics.items(), key=lambda x: x[1]["max_cc"], reverse=True)[:10]

            for module, metrics in sorted_modules:
                cc_table += f"| {module} | {metrics['avg_cc']:.1f} | {metrics['max_cc']} | {metrics['risk']} |\n"
        except Exception as e:
            cc_table += f"| Error processing complexity data | {str(e)} | - | - |\n"

        # Get overall metrics
        overall_avg_cc = "N/A"
        overall_total_cc = "N/A"

        try:
            with open("metrics_output/cc_avg.txt", "r") as f:
                for line in f:
                    if "Average complexity" in line:
                        overall_avg_cc = line.split(":")[1].strip()
                        break
        except Exception:
            pass

        try:
            with open("metrics_output/cc_total.txt", "r") as f:
                for line in f:
                    if "Total complexity" in line:
                        overall_total_cc = line.split(":")[1].strip()
                        break
        except Exception:
            pass

        # Format current date
        current_date = datetime.now().strftime("%Y-%m-%d")

        # Build the report
        report = f"""# 📊 Code Metrics Report

## 🛠️ Metrics Overview

| Metric | Value | Status |
|--------|-------|--------|
| 📈 **Maintainability Index** | Analyzed modules | ✅ Completed |
| 🔄 **Cyclomatic Complexity** | Avg: {overall_avg_cc} / Total: {overall_total_cc} | ✅ Completed |

## 📋 Top Modules by Maintainability

{mi_table}

## 📋 Top Modules by Complexity

{cc_table}

## 📚 Interpretation Guide

- **Maintainability Index (MI)**
  - 100-20: 🟢 Highly maintainable (A-B)
  - 19-10: 🟠 Moderately maintainable (C)
  - 9-0: 🔴 Difficult to maintain (D-F)

- **Cyclomatic Complexity (CC)**
  - 1-5: 🟢 Simple, low risk
  - 6-10: 🟡 Moderate complexity
  - 11-20: 🟠 High complexity
  - 21+: 🔴 Very high complexity, refactor recommended

---
*Generated on: {current_date} by GitHub Actions*
"""

        print(report)
        EOF

    - name: Post metrics comment
      uses: peter-evans/create-or-update-comment@v2
      if: github.event_name == 'pull_request'
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-file: metrics_output/report.md
        edit-mode: replace

    - name: Post metrics as commit comment
      if: github.event_name == 'push'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');

          // Read the report from the file
          const reportContent = fs.readFileSync('metrics_output/report.md', 'utf8');

          // For commit comments, we need to use a different API
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: reportContent
          });

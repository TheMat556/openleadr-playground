name: Code Metrics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-metrics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install radon
    - name: Analyze module maintainability
      run: |
        radon mi . --json > module_metrics.json
    - name: Check module cohesion
      run: |
        radon cc . --average --total

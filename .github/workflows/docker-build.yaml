name: Docker Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install

      - name: Generate Docker Compose
        run: pipenv run generate-docker-compose -c 3 -l 3

      - name: Build Docker images
        run: |
          docker build -f src/docker/top_node/Dockerfile .
          docker build -f src/docker/middle_node/Dockerfile .
          docker build -f src/docker/bottom_node/Dockerfile .
          docker build -f src/docker/node_dashboard/Dockerfile .

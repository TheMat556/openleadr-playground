name: Docker Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: |
          poetry install

      # Build Docker images for each node type
      - name: Build Docker images
        run: |
          # Top node
          docker build \
            --build-arg NODE_TYPE=top_node \
            --build-arg OPENADR_LAYER_ID=0 \
            -f deployment/nodes/Dockerfile .

          # Intermediate node
          docker build \
            --build-arg NODE_TYPE=intermediate_node \
            --build-arg OPENADR_LAYER_ID=1 \
            -f deployment/nodes/Dockerfile .

          # Bottom node
          docker build \
            --build-arg NODE_TYPE=bottom_node \
            --build-arg OPENADR_LAYER_ID=2 \
            -f deployment/nodes/Dockerfile .

          # Network Dashboard
          docker build \
            --build-arg NODE_TYPE=network_dashboard \
            --build-arg OPENADR_LAYER_ID=-1 \
            -f deployment/nodes/Dockerfile .

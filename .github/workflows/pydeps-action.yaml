name: Architecture Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-architecture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydeps import-linter networkx matplotlib python-igraph plotly

    - name: Generate architecture diagram
      run: |
        mkdir -p reports
        pydeps src -o reports/architecture.svg -T svg --cluster --noshow

    - name: Run Import Linter
      run: |
        if [ -f .importlinter ]; then
          lint-imports --report-format json --output-file reports/import_linter.json || echo "Import Linter checks failed, but continuing..."
          lint-imports || echo "Import Linter checks failed, but continuing..."
        else
          echo "No .importlinter file found, skipping"
        fi

    - name: Create custom module analysis report
      run: |
        python - <<EOF
import os
import sys
import ast
import json
import networkx as nx
import matplotlib.pyplot as plt
from collections import defaultdict

def analyze_architecture(directory='src'):
    """Analyze the architecture of the OpenLEADR-Node project."""
    # Track module dependencies
    module_deps = defaultdict(set)
    module_files = {}

    # First, scan for all Python modules
    for root, _, files in os.walk(directory):
        for file in files:
            if file.endswith('.py'):
                filepath = os.path.join(root, file)
                rel_path = os.path.relpath(filepath, os.getcwd())
                module_name = os.path.splitext(rel_path)[0].replace(os.path.sep, '.')

                # Skip non-relevant modules
                if '__pycache__' in module_name or 'venv' in module_name:
                    continue

                # For simplification, group modules by their parent package
                parts = module_name.split('.')
                if len(parts) > 2:  # src.X.Y -> src.X
                    module_name = '.'.join(parts[:2])

                module_files[module_name] = filepath

    # Analyze imports
    for module_name, filepath in module_files.items():
        try:
            with open(filepath, 'r', encoding='utf-8') as file:
                code = file.read()
                tree = ast.parse(code)
                for node in ast.walk(tree):
                    # Handle direct imports: import X, import X.Y
                    if isinstance(node, ast.Import):
                        for name in node.names:
                            imported_name = name.name.split('.')[0]
                            # Check if imported module is in our project
                            for m in module_files:
                                if m.startswith(imported_name + '.') or m == imported_name:
                                    # Get the top-level module
                                    top_module = '.'.join(m.split('.')[:2]) if '.' in m else m
                                    if top_module != module_name:  # Skip self-imports
                                        module_deps[module_name].add(top_module)

                    # Handle from-imports: from X import Y
                    elif isinstance(node, ast.ImportFrom):
                        if node.module:
                            # Check if imported module is in our project
                            imported_name = node.module.split('.')[0]
                            for m in module_files:
                                if m.startswith(imported_name + '.') or m == imported_name:
                                    # Get the top-level module
                                    top_module = '.'.join(m.split('.')[:2]) if '.' in m else m
                                    if top_module != module_name:  # Skip self-imports
                                        module_deps[module_name].add(top_module)
        except (SyntaxError, UnicodeDecodeError, IOError) as e:
            print(f"Couldn't parse {filepath}: {e}")

    # Build the directed graph
    G = nx.DiGraph()

    # Organize modules by their type/layer
    module_types = {}
    for module in module_files:
        parts = module.split('.')
        if len(parts) >= 2:
            module_types[module] = parts[1]  # e.g., node, service, domain
        else:
            module_types[module] = 'other'

    # Add nodes with attributes
    for module in module_files:
        module_type = module_types.get(module, 'other')
        G.add_node(module, type=module_type)

    # Add edges
    for module, deps in module_deps.items():
        for dep in deps:
            G.add_edge(module, dep)

    # Calculate architecture metrics
    total_modules = len(module_files)
    isolated_modules = len([m for m in G.nodes() if G.degree(m) == 0])
    connected_modules = total_modules - isolated_modules
    independent_ratio = isolated_modules / total_modules if total_modules > 0 else 0

    # Find cycles (circular dependencies)
    try:
        cycles = list(nx.simple_cycles(G))
    except:
        cycles = []

    # Create the visualization
    plt.figure(figsize=(14, 10))

    # Use spring layout
    pos = nx.spring_layout(G, k=0.3, iterations=50)

    # Color nodes by module type
    color_map = {
        'node': 'tomato',
        'service': 'royalblue',
        'domain': 'limegreen',
        'infrastructure': 'orange',
        'util': 'purple',
        'other': 'gray'
    }

    node_colors = [color_map.get(module_types.get(n, 'other'), 'gray') for n in G.nodes()]

    # Draw the graph
    nx.draw(G, pos, with_labels=True, node_color=node_colors,
            node_size=1000, alpha=0.8, font_size=8,
            arrows=True, arrowsize=15, edge_color='gray')

    # Add legend
    legend_elements = [plt.Line2D([0], [0], marker='o', color='w',
                     markerfacecolor=color, markersize=10, label=mtype)
                  for mtype, color in color_map.items()
                  if mtype in module_types.values()]

    plt.legend(handles=legend_elements, title="Module Types", loc="upper right")

    # Add title with metrics
    plt.title(f'Module Dependencies\nTotal: {total_modules}, Independent: {isolated_modules} ({independent_ratio:.2%})\nCycles: {len(cycles)}')

    # Save the visualization
    plt.savefig('reports/custom_architecture_diagram.png', dpi=150, bbox_inches='tight')

    # Generate a detailed report
    report = {
        'total_modules': total_modules,
        'independent_modules': isolated_modules,
        'independent_ratio': independent_ratio,
        'cycles_count': len(cycles),
        'cycles': [' -> '.join(c) for c in cycles[:10]],
        'module_types': {k: list(v) for k, v in
                     {type_name: [m for m in module_types if module_types[m] == type_name]
                      for type_name in set(module_types.values())}.items()}
    }

    # Save report as JSON
    with open('reports/custom_architecture_report.json', 'w') as f:
        json.dump(report, f, indent=2)

    # Print summary report
    print(f"\n=== Architecture Analysis Report ===")
    print(f"Total modules: {total_modules}")
    print(f"Independent modules: {isolated_modules} ({independent_ratio:.2%})")
    print(f"Cycles found: {len(cycles)}")

    return independent_ratio >= 0.8  # Pass if at least 80% are independent

analyze_architecture()
EOF

    - name: Upload architecture reports
      uses: actions/upload-artifact@v4
      with:
        name: architecture-reports
        path: reports/

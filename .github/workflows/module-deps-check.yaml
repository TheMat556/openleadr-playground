name: Module Dependency Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.7.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install
        poetry run pip install pyan3 pydeps

    - name: Run pyan module check
      run: |
        poetry run python scripts/pyan_module_check.py --module src.util --source-dir src --verbose

    - name: Run pydeps module check
      run: |
        poetry run python scripts/pydeps_module_check.py --module src.util --source-dir . --verbose

name: pyADDRs Module Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pyaddrs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaddrs

    - name: Analyze architecture with pyADDRs
      run: |
        mkdir -p reports
        python -m pyaddrs.cli verify --source-dir src --ignore-pattern "**/__pycache__/**" --output-file reports/architecture_verification.json

    - name: Upload architecture reports
      uses: actions/upload-artifact@v3
      with:
        name: architecture-reports
        path: reports/

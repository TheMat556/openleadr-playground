name: DeepSource Analysis with Custom Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: DeepSource Analysis
        uses: deepsourcelabs/action-analyzer@master
        with:
          key: ${{ secrets.DEEPSOURCE_DSN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install DeepSource CLI
        run: pip install deepsource-cli

      - name: Generate custom report
        run: |
          mkdir -p metrics

          # Get metrics from DeepSource
          deepsource report download --output metrics/deepsource.json

          # Create custom report (Python script similar to option #3 in my previous response)
          python - <<EOF > metrics/report.md
          import json
          import datetime

          # Current date and time as requested
          current_date = "2025-03-24 15:06:10"
          current_user = "TheMat556"

          with open('metrics/deepsource.json') as f:
              data = json.load(f)

          # Format the report similar to your example
          report = f"""# Code Metrics Report
          Generated on: {current_date} UTC
          Generated by: {current_user}

          ## Project Overview
          | Metric | Value |
          |--------|-------|
          | Total Modules | {data.get('total_modules', 'N/A')} |
          | Total Functions | {data.get('total_functions', 'N/A')} |
          | Average MI Score | {data.get('avg_maintainability', 'N/A')} |
          | Average Complexity | {data.get('avg_complexity', 'N/A')} |
          | Highest Complexity | {data.get('max_complexity', 'N/A')} |

          # ... rest of your format ...
          """

          print(report)
          EOF

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: metrics/report.md

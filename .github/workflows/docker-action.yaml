name: Docker Compose Test

on: [push, pull_request]

jobs:
  docker-compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and run Docker Compose
        run: |
          docker-compose -f src/docker/test-docker-compose/docker-compose.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          docker-compose -f src/docker/test-docker-compose/docker-compose.yml ps
          docker-compose -f src/docker/test-docker-compose/docker-compose.yml logs
          docker-compose -f src/docker/test-docker-compose/docker-compose.yml exec -T 0 curl -f http://localhost:8080 || exit 1

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker-compose -f src/docker/test-docker-compose/docker-compose.yml down

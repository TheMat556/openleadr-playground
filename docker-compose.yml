    environment:
    - VTN_NAME=vtn_0_1_0
    - VTN_URL=http://0:8085/0/1/0/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/1/0/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0_1_0

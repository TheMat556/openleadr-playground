    - VTN_PATH_PREFIX=/0/0/0/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0_0_0
    - GRADIO_PORT=7864
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5002
    - VTN_PORT=8082
    - CONNECT_VTN_URL=http://0_0_node:8081/0/0/OpenADR2/Simple/2.0b
    ports:
    - '8082:8082'
    - '7864:7864'
    - '5002:5002'
    networks:
      my_network:
        aliases:
        - 0_0_0_node
    depends_on:
      '0_0':
        condition: service_healthy
    expose:
    - 8082
  '0_0_1':
    build:
      context: .
      dockerfile: ./src/docker/bottom_node/Dockerfile
    container_name: 0_0_1_container
    environment:
    - VTN_NAME=vtn_0_0_1
    - VTN_URL=http://0:8083/0/0/1/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/0/1/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0_0_1
    - GRADIO_PORT=7865
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5003
    - VTN_PORT=8083
    - CONNECT_VTN_URL=http://0_0_node:8081/0/0/OpenADR2/Simple/2.0b
    ports:
    - '8083:8083'
    - '7865:7865'
    - '5003:5003'
    networks:
      my_network:
        aliases:
        - 0_0_1_node
    depends_on:
      '0_0':
        condition: service_healthy
    expose:

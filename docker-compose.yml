version: '3.8'
services:
  '0':
    build:
      context: .
      dockerfile: ./src/docker/top_node/Dockerfile
    container_name: 0_container
    environment:
    - VTN_NAME=vtn_0
    - VTN_URL=http://0:8080/0/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0
    - GRADIO_PORT=7862
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5000
    - VTN_PORT=8080
    ports:
    - '8080:8080'
    - '7862:7862'
    - '5000:5000'
    networks:
      my_network:
        aliases:
        - 0_node
    depends_on: {}
    expose:
    - 8080
    healthcheck:
      test: 'curl -f -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:8080/0/OpenADR2/Simple/2.0b
        | grep 404 || exit 1'
      interval: 20s
      timeout: 10s
      retries: 5
  '0_0':
    build:
      context: .
      dockerfile: ./src/docker/middle_node/Dockerfile
    container_name: 0_0_container
    environment:
    - VTN_NAME=vtn_0_0
    - VTN_URL=http://0:8081/0/0/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/0/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0_0
    - GRADIO_PORT=7863
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5001
    - VTN_PORT=8081
    - CONNECT_VTN_URL=http://0_node:8080/0/OpenADR2/Simple/2.0b
    ports:
    - '8081:8081'
    - '7863:7863'
    - '5001:5001'
    networks:
      my_network:
        aliases:
        - 0_0_node
    depends_on:
      '0':
        condition: service_healthy
    expose:
    - 8081
    healthcheck:
      test: 'curl -f -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:8081/0/0/OpenADR2/Simple/2.0b
        | grep 404 || exit 1'
      interval: 20s
      timeout: 10s
      retries: 5
  '0_0_0':
    build:
      context: .
      dockerfile: ./src/docker/bottom_node/Dockerfile
    container_name: 0_0_0_container

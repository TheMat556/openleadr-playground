    - VEN_NAME=ven_0_1
    - GRADIO_PORT=7866
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5004
    - VTN_PORT=8084
    - CONNECT_VTN_URL=http://0_node:8080/0/OpenADR2/Simple/2.0b
    ports:
    - '8084:8084'
    - '7866:7866'
    - '5004:5004'
    networks:
      my_network:
        aliases:
        - 0_1_node
    depends_on:
      '0':
        condition: service_healthy
    expose:
    - 8084
    healthcheck:
      test: 'curl -f -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:8084/0/1/OpenADR2/Simple/2.0b

networks:
  my_network:
    driver: bridge
services:
  '0':
    build:
      context: .
      dockerfile: ./src/docker/top_node/Dockerfile
    container_name: 0_container
    depends_on: []
    environment:
    - VTN_NAME=vtn_0
    - VTN_URL=http://0.0.0.0:8080/0/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0
    - GRADIO_PORT=7862

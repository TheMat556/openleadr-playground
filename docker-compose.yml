    environment:
    - VTN_NAME=vtn_0_1_1
    - VTN_URL=http://0:8086/0/1/1/OpenADR2/Simple/2.0b
    - VTN_PATH_PREFIX=/0/1/1/OpenADR2/Simple/2.0b
    - VEN_NAME=ven_0_1_1
    - GRADIO_PORT=7868
    - GRADIO_SERVER_NAME=0.0.0.0
    - REST_API_PORT=5006
    - VTN_PORT=8086
    - CONNECT_VTN_URL=http://0_1_node:8084/0/1/OpenADR2/Simple/2.0b
